# Tiny Tapeout project information (Wokwi project)
project:
  wokwi_id:     0       # Set this to the ID of your Wokwi project (the number from the project's URL)
  title:        "Morse Decoder to 7-Seg"      # Project title
  author:       "Dana Neveu y Joaquin Argel"      # Your name
  discord:      "neevu"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Decodificador Morse a display de 7 segmentos con un solo botón"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2


